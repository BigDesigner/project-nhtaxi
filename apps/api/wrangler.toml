name = "gnncab-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev subdomain alongside the custom domain below — CI PR
# previews (`wrangler versions upload`) need it to hand back a preview URL.
workers_dev = true

# nhtaxi.com is already on this Cloudflare account (L27/L29) — no DNS
# migration needed, wrangler manages the custom domain + DNS record.
routes = [
  { pattern = "api.nhtaxi.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "gnncab"
database_id = "ace418c0-d37b-4260-ac15-04aff2b8dda3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "gnncab-driver-documents"

[[durable_objects.bindings]]
name = "DISPATCH_COORDINATOR"
class_name = "DispatchCoordinator"

[[durable_objects.bindings]]
name = "LOCATION_HUB"
class_name = "LocationHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DispatchCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LocationHub"]

[triggers]
# Faz 5b — stale-session sweep (closes abandoned driver sessions so an app
# crash/connectivity loss never bills forever). Free tier, no cost.
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
# Routing engine used to price trips by real driving distance. Any
# OSRM-compatible endpoint works, so swapping the public demo instance for a
# self-hosted or commercial one is a change to this line and nothing else.
# Do that before real volume: the public instance is not a production service
# and can rate-limit us, at which point quoting fails closed (503) rather
# than falling back to a wrong price.
ROUTING_BASE_URL = "https://router.project-osrm.org"

# Secrets (JWT_SECRET, STRIPE_*, FCM_*) are never set here — they are pushed
# with `wrangler secret put <NAME>` and injected by CI from GitHub Secrets (L25).

# Enabled via the dashboard while debugging the Faz 1 register 500 — mirrored
# here so the next `wrangler deploy` doesn't silently revert it (wrangler.toml
# is the source of truth on every deploy).
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
