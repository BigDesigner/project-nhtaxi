name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  # Steps below skip gracefully until CLOUDFLARE_API_TOKEN /
  # CLOUDFLARE_ACCOUNT_ID exist (see README.md "GitHub Secrets") — lets the
  # repo exist and CI stay green before the one-time Cloudflare setup is
  # done. The `secrets` context can't be used directly in `if:`, so the
  # check happens in a shell step instead.
  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check Cloudflare credentials are configured
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cf.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # L22 — never migrate a live financial/trip database without a fresh
      # export first. This lands as a workflow artifact (90-day retention);
      # promote to a dedicated R2/off-platform backup once volume justifies it.
      - name: Back up D1 before migrating
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/api
        run: npx wrangler d1 export gnncab --remote --output=backup.sql

      - name: Upload D1 backup artifact
        if: steps.cf.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.sha }}
          path: apps/api/backup.sql
          retention-days: 90

      - name: Apply D1 migrations
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/api
        run: npx wrangler d1 migrations apply gnncab --remote

      - name: Deploy Worker
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/api
        run: npx wrangler deploy

  # TODO(Faz 8): add a deploy-admin job once apps/admin (ported React admin)
  # exists — `wrangler pages deploy apps/admin/dist --project-name=gnncab-admin`.
