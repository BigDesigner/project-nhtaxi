name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run test

  # Steps below skip gracefully until CLOUDFLARE_API_TOKEN /
  # CLOUDFLARE_ACCOUNT_ID exist (see README.md "GitHub Secrets") — lets the
  # repo exist and CI stay green before the one-time Cloudflare setup is
  # done. The `secrets` context can't be used directly in `if:`, so the
  # check happens in a shell step instead.
  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check Cloudflare credentials are configured
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cf.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # L22 — never migrate a live financial/trip database without a fresh
      # export first. Keep the export on the ephemeral runner: this public
      # repository's artifacts are readable by other GitHub users. D1 Time
      # Travel remains the durable restore path; see ADR 0011.
      - name: Back up D1 before migrating
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 export gnncab --remote --output=backup.sql

      - name: Apply D1 migrations
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply gnncab --remote

      - name: Deploy Worker
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy
