name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run test

  # Uploads a new Worker version without shipping it to production traffic —
  # wrangler hands back a unique <version>-gnncab-api.<subdomain>.workers.dev
  # preview URL for this PR. Steps below skip gracefully until
  # CLOUDFLARE_API_TOKEN exists (see README.md "GitHub Secrets") — the
  # `secrets` context can't be used directly in `if:`, so the check happens
  # in a shell step instead.
  preview-api:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check Cloudflare credentials are configured
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Upload preview version
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.number }}"
