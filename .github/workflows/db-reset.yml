name: Database Reset

# One-time, destructive, manual-only launch reset. Wipes every trip/driver/
# customer/activity row, keeping only the info@nhtaxi.com admin account —
# so the app comes back up as a blank slate for real customers instead of
# carrying this project's smoke-test history forward. Never runs
# automatically; requires typing RESET into the workflow_dispatch input, and
# always takes a fresh D1 export first (uploaded as an artifact) in case
# anything needs to be pulled back out afterward. See apps/api/scripts/
# reset-to-launch.sql for exactly what runs.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to wipe all trip/driver/customer data (info@nhtaxi.com is kept)'
        required: true

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Abort unless explicitly confirmed
        if: github.event.inputs.confirm != 'RESET'
        run: |
          echo "Confirmation text did not match 'RESET' exactly — aborting without touching anything."
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Backup before wiping anything
        working-directory: apps/api
        run: npx wrangler d1 export gnncab --remote --output=pre-reset-backup.sql

      - name: Upload pre-reset backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-reset-backup-${{ github.run_id }}
          path: apps/api/pre-reset-backup.sql
          retention-days: 30

      - name: Wipe all trip/driver/customer/activity data
        working-directory: apps/api
        run: npx wrangler d1 execute gnncab --remote --file=./scripts/reset-to-launch.sql

      - name: Verify result
        working-directory: apps/api
        run: |
          npx wrangler d1 execute gnncab --remote --command="SELECT (SELECT COUNT(*) FROM users) users, (SELECT email FROM users) remaining_email, (SELECT COUNT(*) FROM trips) trips, (SELECT COUNT(*) FROM driver_profiles) drivers, (SELECT COUNT(*) FROM customer_profiles) customers, (SELECT COUNT(*) FROM audit_logs) audit_logs;"
