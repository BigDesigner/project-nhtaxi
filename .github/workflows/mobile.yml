name: Mobile

# L26 stage 1: CI builds a debug APK, you download the artifact and run it on
# an emulator. No store signing and no iOS — macOS runners burn the free
# Actions quota ~10x, so iOS waits until there's a reason to pay for it.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version verified locally — a silent minor bump can
          # change analyzer behaviour and break CI without a code change.
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # --target-platform includes x86_64 so the APK actually runs on a
      # standard Android emulator, not just physical ARM devices.
      - name: Build debug APK
        run: flutter build apk --debug --target-platform=android-arm,android-arm64,android-x64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gnncab-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # L32 — Flutter Web preview on Cloudflare Pages, so the app can be opened
  # on a real phone browser with no install. Complements the APK above; it
  # does NOT replace it, since background GPS and FCM push are unreliable on
  # mobile web (especially iOS Safari).
  deploy-web:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Same pattern as deploy.yml: the `secrets` context isn't allowed in a
      # job-level `if:`, so the gate lives in a shell step.
      - name: Check Cloudflare credentials are configured
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing — skipping web preview deploy."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.creds.outputs.configured == 'true'
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: flutter pub get

      # No --dart-define: the default in core/config.dart is production, which
      # is what the preview must talk to. preview.nhtaxi.com is already in the
      # API's production CORS allowlist (apps/api/src/app.ts).
      - name: Build web
        if: steps.creds.outputs.configured == 'true'
        run: flutter build web --release

      # `pages deploy` does not create the project, and `project create` errors
      # if it already exists — so swallow that specific case to stay idempotent
      # across runs.
      - name: Ensure Pages project exists
        if: steps.creds.outputs.configured == 'true'
        run: |
          npx wrangler@4 pages project create gnncab-preview --production-branch=main \
            || echo "Project already exists — continuing."

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        run: npx wrangler@4 pages deploy build/web --project-name=gnncab-preview --branch=main
