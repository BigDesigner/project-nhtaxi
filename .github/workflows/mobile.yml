name: Mobile

# L26 stage 1: CI can build a debug APK on request, you download the artifact
# and run it on an emulator. No store signing and no iOS — macOS runners burn
# the free Actions quota ~10x, so iOS waits until there's a reason to pay for it.
#
# The APK build is workflow_dispatch-only, not on every push. It used to build
# on every commit under apps/mobile/**, and since this repo never uses PRs
# (single branch, direct pushes), that meant one ~85MB debug APK per commit,
# retained 14 days — 37 of them alone accounted for ~3GB against GitHub's
# 500MB free Actions storage quota, blocking the account entirely. Analyze +
# test still run on every push/PR as the actual CI gate; the APK itself is
# opt-in via "Run workflow" whenever someone actually needs to install one.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          # Pinned to the version verified locally — a silent minor bump can
          # change analyzer behaviour and break CI without a code change.
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Produces zero artifacts on the automatic push/PR triggers — only when
  # someone explicitly runs it (GitHub Actions tab → Mobile → Run workflow).
  build-apk:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # --target-platform includes x86_64 so the APK actually runs on a
      # standard Android emulator, not just physical ARM devices.
      - name: Build debug APK
        run: flutter build apk --debug --target-platform=android-arm,android-arm64,android-x64

      # Short retention on purpose — this is a throwaway for one round of
      # manual testing, not a release artifact worth keeping around.
      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nhtaxi-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  # L32 — Flutter Web preview on Cloudflare Pages, so the app can be opened
  # on a real phone browser with no install. Complements the on-demand APK
  # above; it does NOT replace it, since background GPS and FCM push are
  # unreliable on mobile web (especially iOS Safari). Runs on every push to
  # main, same as before — it deploys to Pages rather than uploading an
  # Actions artifact, so it was never part of the storage problem.
  deploy-web:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Same pattern as deploy.yml: the `secrets` context isn't allowed in a
      # job-level `if:`, so the gate lives in a shell step.
      - name: Check Cloudflare credentials are configured
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing — skipping web preview deploy."
          fi

      - uses: subosito/flutter-action@v2.23.0
        if: steps.creds.outputs.configured == 'true'
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: flutter pub get --enforce-lockfile

      # No --dart-define: the default in core/config.dart is production, which
      # is what the preview must talk to. gnncab.nhtaxi.com is already in the
      # API's production CORS allowlist (apps/api/src/app.ts).
      # --no-tree-shake-icons: release builds subset the Material icon font to
      # the glyphs the tree-shaker can prove are used, and it was dropping ones
      # that are used — icons rendered as blank space on the deployed site
      # while the same screens were fine in debug. Shipping the whole font
      # costs a few hundred KB gzipped and makes "the icon vanished in
      # production" impossible, which is worth more than the bytes here.
      - name: Build web
        if: steps.creds.outputs.configured == 'true'
        run: flutter build web --release --no-tree-shake-icons

      - uses: pnpm/action-setup@v6.1.0
        if: steps.creds.outputs.configured == 'true'

      - uses: actions/setup-node@v7.1.0
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned deployment tools
        if: steps.creds.outputs.configured == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile

      # The Pages project already exists. Fail visibly on auth/config errors;
      # use the same lockfile-pinned Wrangler as the API deployment.
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        working-directory: .
        run: pnpm --filter @gnncab/api exec wrangler pages deploy ../mobile/build/web --project-name=gnncab-preview --branch=main
