packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-plugin@1.4.8'
  - miniflare@5.20261023.0-beta
  - wrangler@4.153.0
# Remove these overrides once the upstream dependency floors include the fixes.
# Keep major versions intact except for drizzle-kit's retired esbuild loader:
# only its transform API is used, verified by the migration-generation check.
overrides:
  'esbuild@<0.24.3': 0.25.12
  'vite@>=8.0.0 <8.1.6': ^8.1.6
  'postcss@<8.5.23': ^8.5.23
  'nanoid@>=3.0.0 <3.3.18': ^3.3.18
  'source-map-js@<1.2.2': ^1.2.2
